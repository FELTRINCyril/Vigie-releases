name: Poser une question
description: Une question sur l'installation ou l'utilisation de Vigie.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Ce message sera public.** Tout le monde peut lire les issues de ce dépôt.
        > Vigie affiche les fichiers de votre Mac : n'y collez **jamais** de chemin complet
        > (il contient votre nom d'utilisateur), de nom de client ou de projet, ni de mot de passe,
        > même dans une capture d'écran. Masquez-les avant d'envoyer.

        Avant de demander, la réponse est peut-être déjà dans les
        [questions fréquentes du site](https://feltrincyril.github.io/Vigie-releases/#questions).

  - type: textarea
    id: question
    attributes:
      label: Votre question
    validations:
      required: true

  - type: input
    id: version-vigie
    attributes:
      label: Version de Vigie (facultatif)
      description: "Dans le Finder : Applications, clic droit sur Vigie > Lire les informations."
      placeholder: "0.3.0"
    validations:
      required: false

  - type: input
    id: version-systeme
    attributes:
      label: Version de macOS (facultatif)
      placeholder: "macOS 27.2.1"
    validations:
      required: false

  - type: checkboxes
    id: confidentialite
    attributes:
      label: Confidentialité
      options:
        - label: Je n'ai mis aucune information personnelle (chemin complet, nom de client ou de projet) dans ce message.
          required: true
